<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fundo arredondado com gradiente -->
  <rect width="200" height="200" fill="url(#grad1)" rx="40"/>
  
  <!-- Letra E maior e mais legível -->
  <text x="100" y="145" font-size="140" font-weight="900" text-anchor="middle" fill="white" font-family="Arial, sans-serif" letter-spacing="-5">E</text>
  
  <!-- Decoração: ponto pequeno -->
  <circle cx="160" cy="60" r="8" fill="white" opacity="0.8"/>
</svg>
